name: Regen lockfiles (linux)

# One-shot helper: the committed lockfiles were generated on Windows and npm ci
# rejects them on the Linux CI runner (picomatch/fdir hoisting differs by
# platform). Regenerate both lockfiles ON LINUX, prove `npm ci` accepts them
# here, and push to a branch for review. Manually triggered; not part of normal CI.
on:
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: |
          echo "::warning title=regen-toolchain::node=$(node -v) npm=$(npm -v)"

      - name: Regenerate root lockfile (linux)
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Regenerate server lockfile (linux)
        working-directory: server
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Verify npm ci accepts them on linux (root)
        run: npm ci
      - name: Verify npm ci accepts them on linux (server)
        working-directory: server
        run: npm ci

      - name: Push regenerated lockfiles to a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ci/linux-lockfile
          git add package-lock.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "::warning::no lockfile changes produced on linux"
            exit 0
          fi
          git commit -m "chore(deps): regenerate lockfiles on linux so npm ci passes in CI"
          git push -f origin ci/linux-lockfile
